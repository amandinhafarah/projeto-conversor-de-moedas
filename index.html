<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>Global Convert</title>
  </head>
  <body>
    <header>
      <img src="./assets/Logo Global Convert_ Câmbio Global.png" alt="Logo do Conversor" class="logo"/>
    </header>

    <main>
      <video src="assets/video2.mp4" autoplay muted loop alt="Vídeo de fundo"></video>

      <label>Converter <b>de</b>
        <select>
          <option>R$ Real Brasileiro</option>
        </select>
      </label>

      <label>Converter <b>para</b>
        <select id="currency-select">
          <option value="dolar">US$ Dólar Americano</option>
          <option value="euro">€ Euro</option>
          <option value="libra">£ Libra Esterlina</option>
          <option value="bitcoin">₿ Bitcoin</option>
        </select>
      </label>

      <label>
        Valor <b>convertido</b>
        <input id="input-currency" placeholder="Ex.: R$ 10.000,00" />
      </label>

      <button id="convert-button">Converter</button>

      <section>
        <div>
          <img src="assets/real.png" alt="moeda-real" id="currency-image-to-convert"/>
          <p id="currency-name-to-convert">Real</p>
          <p class="valor" id="currency-value-to-convert">R$ 10.000,00</p>
        </div>
        <img src="assets/arrow.png" alt="seta-direita" class="arrow" />
        <div>
          <img src="assets/dolar.png" alt="moeda-dolar" id="currency-image-converter"/>
          <p id="currency-name-converter">Dólar Americano</p>
          <p class="valor" id="currency-value">US$ 10.000,00</p>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 GlobalConvert. Todos os direitos reservados.</p>
      <p>Desenvolvido para conectar você ao mundo.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
